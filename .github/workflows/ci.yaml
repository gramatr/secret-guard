name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: arc-runner-gramatr
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Run core smoke tests
        run: bash tests/test_core.sh

      - name: Run Claude Code adapter smoke tests
        run: bash tests/test_claude_code_adapter.sh

      - name: Run report.sh smoke tests
        run: bash tests/test_report.sh
