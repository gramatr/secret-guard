name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # arc-runner-gramatr (the org's self-hosted ARC pool) refuses jobs from
    # public repos by default — a GitHub security measure, not a flake (see
    # soc2-coordination secret-leak-to-zammad PR history for the full story).
    # This repo is intentionally public (grāmatr plugin, same as
    # claude-plugin/codex-plugin/gemini-extension), so it stays on
    # GitHub-hosted ubuntu-latest, which public repos get free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Run core smoke tests
        run: bash tests/test_core.sh

      - name: Run Claude Code adapter smoke tests
        run: bash tests/test_claude_code_adapter.sh

      - name: Run report.sh smoke tests
        run: bash tests/test_report.sh
